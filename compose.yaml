name: taskmaster
x-app: &app
  image: taskmaster:local
  build:
    context: .
    args:
      BASE_PATH: ${BASE_PATH:-/taskmaster}
  env_file: .env
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  extra_hosts: ['host.docker.internal:host-gateway']
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "3"}
  volumes: [attachments:/data/attachments]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskmaster
      POSTGRES_USER: taskmaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=40]
    volumes: [postgres:/var/lib/postgresql/data]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U taskmaster -d taskmaster']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory, 64mb, --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    mem_limit: 128m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 192m
  api:
    <<: *app
    command: [uvicorn, app.api:app, --host, 0.0.0.0, --port, '8000', --no-access-log, --proxy-headers, --forwarded-allow-ips, '*', --root-path, '${BASE_PATH:-/taskmaster}']
    networks:
      default:
      proxy:
        aliases: [taskmaster-api]
    ports: ['127.0.0.1:8097:8000']
    mem_limit: 320m
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)']
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
  bot:
    <<: *app
    command: [python, -m, app.bot]
    mem_limit: 256m
    healthcheck:
      test: [CMD, python, -c, 'import os; os.kill(1, 0)']
      interval: 30s
  worker:
    <<: *app
    command: [python, -m, app.worker]
    mem_limit: 192m
    healthcheck:
      test: [CMD, python, -c, 'import os; os.kill(1, 0)']
      interval: 30s
  test:
    <<: *app
    profiles: [test]
    command: [python, -m, pytest, -q]
    restart: 'no'
    environment:
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
    mem_limit: 320m
volumes:
  postgres:
  redis:
  attachments:
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-snabdesk_default}
