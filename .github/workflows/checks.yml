name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskmaster_test
          POSTGRES_USER: taskmaster
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U taskmaster -d taskmaster_test' --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BOT_TOKEN: '123456:TESTONLY'
      BOT_USERNAME: testbot
      APP_URL: https://example.com/taskmaster/
      DATABASE_URL: postgresql+asyncpg://taskmaster:test-only@127.0.0.1:5432/taskmaster_test
      TEST_DATABASE_URL: postgresql+asyncpg://taskmaster:test-only@127.0.0.1:5432/taskmaster_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: test-only-not-a-production-secret
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      ATTACHMENT_DIR: /tmp/taskmaster-attachments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: mkdir -p /tmp/taskmaster-attachments
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm audit --prefix frontend --audit-level=high
